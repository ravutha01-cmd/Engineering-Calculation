<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAMBO STRUCT · Engineering Design</title>
  <meta name="description" content="Structural design web app: project dashboard, main elements, element schedules, Eurocode calculations with full calculation detail, specification and detailing.">
  <script>
    /* apply saved theme before paint */
    try { var t = localStorage.getItem('cambo.theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="btn icon-only menu-btn" id="menuBtn" aria-label="Menu"></button>
      <div class="brand"><div class="logo">CS</div><div>CAMBO STRUCT<small>Engineering Design · Eurocodes</small></div></div>
      <select class="ctl" id="projSel" aria-label="Project"></select>
      <button class="search-btn" id="searchBtn" title="Quick search (Ctrl+K)" aria-label="Quick search"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></svg><span>Search…</span><kbd>Ctrl K</kbd></button>
      <div class="spacer"></div>
      <span id="syncState" class="sync local" role="status" aria-live="polite"></span>
      <button class="btn hide-sm" id="btnExport" title="Export all projects (JSON)"></button>
      <button class="btn hide-sm" id="btnImport" title="Import projects (JSON)"></button>
      <input type="file" id="fileImport" accept="application/json,.json" hidden>
      <button class="acct" id="acctBtn" title="Account"></button>
      <button class="btn icon-only" id="themeBtn" aria-label="Toggle light / dark mode" title="Light / dark mode"></button>
    </header>
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>
  <script src="js/calc/common.js"></script>
  <script src="js/calc/beam.js"></script>
  <script src="js/calc/column.js"></script>
  <script src="js/calc/slab.js"></script>
  <script src="js/calc/foundation.js"></script>
  <script src="js/calc/steel.js"></script>
  <script src="js/calc/foundation2.js"></script>
  <script src="js/calc/geo_common.js"></script>
  <script src="js/calc/geo1.js"></script>
  <script src="js/calc/geo2.js"></script>
  <script src="js/calc/actions.js"></script>
  <script src="js/calc/actions_tall.js"></script>
  <script src="js/calc/steel2.js"></script>
  <script src="js/calc/ec2_members.js"></script>
  <script src="js/calc/ec2_details.js"></script>
  <script src="js/calc/ec2_sls.js"></script>
  <script src="js/library.js"></script>
  <script src="js/mcad/engine.js"></script>
  <script src="js/mcad/compute.js"></script>
  <script src="js/mcad/render.js"></script>
  <script src="js/mcad/catalog.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/etabs.js"></script>
  <script src="js/etabs_building.js"></script>
  <script src="js/etabs_loads.js"></script>
  <script src="js/mcui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
